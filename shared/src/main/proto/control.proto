syntax = "proto3";
package dev.controlpad.protocol;
// TCP/本地 Socket 均使用 4 字节大端长度 + protobuf 消息。
message Packet {
  int32 kind = 1; int64 sequence = 2; int64 gesture = 3; int32 display_version = 4;
  float x = 5; float y = 6; int32 code = 7; bool flag = 8;
  string text = 9; bytes blob = 10; int64 time = 11;
}
